services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: unilink
      POSTGRES_USER: unilink
      POSTGRES_PASSWORD: unilink
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
volumes:
  pgdata: